title: Multiple Failed SSH Login Attempts
id: 9a1b2c3d-1111-4444-8888-000000000001
status: experimental
description: Detects failed SSH authentication attempts on Linux endpoints; the Wazuh rule applies the frequency threshold.
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains:
      - "Failed password"
      - "Invalid user"
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1110.001
