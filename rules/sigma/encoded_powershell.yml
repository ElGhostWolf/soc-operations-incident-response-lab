title: Suspicious Encoded PowerShell Execution
id: 9a1b2c3d-2222-4444-8888-000000000002
status: experimental
description: Detects PowerShell executed with -EncodedCommand or -enc flags.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1059.001
